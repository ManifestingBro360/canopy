name: Proposal
description: A change or addition
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: What you were trying to do and what got in the way. }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What you propose }
  - type: checkboxes
    id: pillar
    attributes:
      label: Which pillar does it serve
      options: [{ label: Security }, { label: Performance }, { label: Quality }, { label: Maintainability }, { label: Context }]
