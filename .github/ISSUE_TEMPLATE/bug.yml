name: Bug report
description: Something Canopy did wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you ran, what you expected, what you got. }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: "Commands, or a small repository. Include the output of `canopy land --json` if a landing is involved." }
  - type: input
    id: env
    attributes: { label: Environment, description: "OS, `node --version`, `git --version`, harness and version" }
    validations: { required: true }
