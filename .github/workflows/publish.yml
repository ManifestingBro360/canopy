name: publish
# Publishes to npm when a GitHub release is published. Uses npm trusted
# publishing (OpenID Connect): no token is stored, and the package carries a
# provenance statement linking it to this repository and commit.
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - id: have
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "canopy-land@$v" version >/dev/null 2>&1; then echo "published=yes" >> "$GITHUB_OUTPUT"; echo "canopy-land@$v is already on npm; nothing to publish"; fi
      - if: steps.have.outputs.published != 'yes'
        run: npm test
      - if: steps.have.outputs.published != 'yes'
        run: npm publish --provenance --access public
