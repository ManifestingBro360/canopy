<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<title id="t">How Canopy works</title>
<desc id="d">Two agents work in separate worktrees. Agent A changes a function that Agent B calls. Canopy records both, tells Agent B at once, and B fixes its call. Each change then passes a gate with five stages: recorded, checks, second opinion, people, signed. Only signed changes move main, and from main to staging and production.</desc>
<style>
  .bg{fill:#FBFAF7}.card{fill:#fff;stroke:#E7E3DA}.ink{fill:#16130F}.mut{fill:#6B655C}.ln{stroke:#D2CCC0;fill:none;stroke-width:1.5}
  .blk{fill:#DBD7CD}.a{fill:#6A5AE0}.b{fill:#E3A01B}.ok{fill:#0F7A55}.okl{stroke:#0F7A55}.seg{fill:#E7E3DA}
  .cap{fill:#16130F;font-size:15px;font-weight:600}
  @media (prefers-color-scheme: dark){.bg{fill:#0E0D0B}.card{fill:#171512;stroke:#2C2823}.ink,.cap{fill:#EDE9E0}.mut{fill:#9A9388}.ln{stroke:#3A362F}.blk{fill:#3A362F}.seg{fill:#2C2823}.a{fill:#9D91FF}.b{fill:#F0BC5A}.ok{fill:#4CC79A}.okl{stroke:#4CC79A}}
  /* One 16-second story. Every moving part is a fade or a slide keyed to the same clock. */
  .s{animation:16s linear infinite both}
  .aEdit{animation-name:aEdit}.bEdit{animation-name:bEdit}.arc{animation-name:arc;stroke-dasharray:6 5}.bFix{animation-name:bFix}
  .g1{animation-name:g1}.g2{animation-name:g2}.g3{animation-name:g3}.g4{animation-name:g4}.g5{animation-name:g5}
  .m1{animation-name:m1}.e1{animation-name:e1}.e2{animation-name:e2}
  .c1{animation-name:c1}.c2{animation-name:c2}.c3{animation-name:c3}.c4{animation-name:c4}.c5{animation-name:c5}
  @keyframes bEdit{0%,5%{opacity:0}9%,100%{opacity:1}}
  @keyframes aEdit{0%,18%{opacity:0}22%,100%{opacity:1}}
  @keyframes arc{0%,24%{opacity:0}28%,40%{opacity:1}46%,100%{opacity:0}}
  @keyframes bFix{0%,38%{opacity:0}42%,100%{opacity:1}}
  @keyframes g1{0%,48%{opacity:0}51%,100%{opacity:1}}
  @keyframes g2{0%,53%{opacity:0}56%,100%{opacity:1}}
  @keyframes g3{0%,58%{opacity:0}61%,100%{opacity:1}}
  @keyframes g4{0%,63%{opacity:0}66%,100%{opacity:1}}
  @keyframes g5{0%,68%{opacity:0}71%,100%{opacity:1}}
  @keyframes m1{0%,72%{opacity:0;transform:translateX(-14px)}76%,100%{opacity:1;transform:none}}
  @keyframes e1{0%,82%{opacity:0;transform:translateX(-14px)}85%,100%{opacity:1;transform:none}}
  @keyframes e2{0%,89%{opacity:0;transform:translateX(-14px)}92%,100%{opacity:1;transform:none}}
  @keyframes c1{0%,2%{opacity:0}5%,20%{opacity:1}23%,100%{opacity:0}}
  @keyframes c2{0%,23%{opacity:0}26%,44%{opacity:1}47%,100%{opacity:0}}
  @keyframes c3{0%,47%{opacity:0}50%,70%{opacity:1}73%,100%{opacity:0}}
  @keyframes c4{0%,73%{opacity:0}76%,97%{opacity:1}100%{opacity:0}}
  /* Without motion, show the finished picture and one caption that says it all. */
  @media (prefers-reduced-motion: reduce){.s{animation:none;opacity:1}.arc,.c1,.c2,.c3{opacity:0}.c4{opacity:1}}
</style>
<rect class="bg" width="880" height="400" rx="14"/>

<!-- Agents, each in its own worktree -->
<g>
  <rect class="card" x="24" y="56" width="236" height="104" rx="10"/>
  <text class="ink" x="40" y="80" font-weight="600">Agent A</text><text class="mut" x="100" y="80">worktree feat/refunds</text>
  <rect class="blk" x="40" y="96" width="60" height="44" rx="4"/><rect class="blk" x="108" y="96" width="60" height="44" rx="4"/><rect class="blk" x="176" y="96" width="60" height="44" rx="4"/>
  <rect class="a s aEdit" x="108" y="96" width="60" height="44" rx="4"/>
  <text class="mut" x="108" y="154" font-size="11">charge()</text>

  <rect class="card" x="24" y="186" width="236" height="104" rx="10"/>
  <text class="ink" x="40" y="210" font-weight="600">Agent B</text><text class="mut" x="100" y="210">worktree fix/cart</text>
  <rect class="blk" x="40" y="226" width="60" height="44" rx="4"/><rect class="blk" x="108" y="226" width="60" height="44" rx="4"/><rect class="blk" x="176" y="226" width="60" height="44" rx="4"/>
  <rect class="b s bEdit" x="176" y="226" width="60" height="44" rx="4"/>
  <g class="s bFix"><circle class="ok" cx="236" cy="226" r="9"/><path d="M231.5 226l3 3.2 5.5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="mut" x="176" y="284" font-size="11">calls charge()</text>
  <path class="ln s arc" d="M138 140C138 190 206 180 206 224" stroke="#16130F"/>
</g>

<!-- Canopy: the record and the gate -->
<path class="ln" d="M260 108H318M260 238H318"/>
<rect class="card" x="318" y="56" width="266" height="234" rx="10"/>
<g transform="translate(336 72) scale(.42)"><path d="M10 18 32 6v24z" fill="#19A974"/><path d="M54 18 32 6v24z" fill="#F2B441"/><path class="ink" d="M10 27l22 12v20L10 47z"/><path class="mut" d="M54 27 32 39v20l22-12z"/></g>
<text class="ink" x="368" y="92" font-weight="600" font-size="15">Canopy</text>
<text class="mut" x="336" y="122">Records what each agent reads and writes</text>
<text class="mut" x="336" y="142">Tells an agent when its ground shifts</text>
<text class="ink" x="336" y="182" font-weight="600">The gate</text>
<g>
  <rect class="seg" x="336" y="196" width="42" height="10" rx="2"/><rect class="seg" x="384" y="196" width="42" height="10" rx="2"/><rect class="seg" x="432" y="196" width="42" height="10" rx="2"/><rect class="seg" x="480" y="196" width="42" height="10" rx="2"/><rect class="seg" x="528" y="196" width="42" height="10" rx="2"/>
  <rect class="ok s g1" x="336" y="196" width="42" height="10" rx="2"/><rect class="ok s g2" x="384" y="196" width="42" height="10" rx="2"/><rect class="ok s g3" x="432" y="196" width="42" height="10" rx="2"/><rect class="ok s g4" x="480" y="196" width="42" height="10" rx="2"/><rect class="ok s g5" x="528" y="196" width="42" height="10" rx="2"/>
  <g class="mut" font-size="10.5" text-anchor="middle"><text x="357" y="224">Record</text><text x="405" y="224">Checks</text><text x="453" y="224">Review</text><text x="501" y="224">People</text><text x="549" y="224">Signed</text></g>
</g>
<text class="mut" x="336" y="270" font-size="11.5">Rules come from main, not from a prompt</text>

<!-- main and the environments after it -->
<path class="ln" d="M584 173H640"/>
<g>
  <rect class="card" x="640" y="56" width="216" height="234" rx="10"/>
  <text class="ink" x="656" y="80" font-weight="600">main</text><text class="mut" x="694" y="80">signed landings only</text>
  <path class="ln" d="M668 112H832"/><circle class="blk" cx="668" cy="112" r="7"/><circle class="blk" cx="706" cy="112" r="7"/>
  <g class="s m1"><circle class="ok" cx="744" cy="112" r="7"/><text class="mut" x="728" y="136" font-size="11">A, then B</text></g>
  <text class="ink" x="656" y="176" font-weight="600">staging</text>
  <path class="ln" d="M668 196H832"/><circle class="blk" cx="668" cy="196" r="7"/><g class="s e1"><circle class="ok" cx="706" cy="196" r="7"/></g>
  <text class="ink" x="656" y="240" font-weight="600">production</text>
  <path class="ln" d="M668 260H832"/><circle class="blk" cx="668" cy="260" r="7"/><g class="s e2"><circle class="ok" cx="706" cy="260" r="7"/></g>
</g>

<!-- Captions -->
<text class="mut" x="24" y="34">How Canopy works</text>
<g class="cap" text-anchor="middle">
  <text class="s c1" x="440" y="344">Agents work side by side, each in its own worktree. Canopy records every read and write.</text>
  <text class="s c2" x="440" y="344">A changes a function B calls. B is told in its next step, and fixes its call before committing.</text>
  <text class="s c3" x="440" y="344">Each change passes the same gate: recorded, checked, reviewed, approved by its owners, signed.</text>
  <text class="s c4" x="440" y="344">Only signed changes move main, and only promoted ones reach staging and production.</text>
</g>
<text class="mut" x="440" y="372" text-anchor="middle" font-size="11.5">Works with Claude Code, Codex and any harness. Notices are a line or two, so little context is spent.</text>
</svg>
