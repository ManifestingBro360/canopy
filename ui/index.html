<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canopy</title>
<style>
:root {
  --ground: #FBFAF7; --surface: #FFFFFF; --ink: #16130F; --muted: #6B655C; --line: #E7E3DA;
  --block: #DBD7CD; --slab: #EFECE4; --ok: #0F7A55; --bad: #C2412D; --wait: #A96D05; --tint: #F4F1EA;
  --shadow: 0 1px 2px rgba(22,19,15,.06), 0 8px 24px rgba(22,19,15,.06);
  --sans: "Geist", "Inter", "Helvetica Neue", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #0E0D0B; --surface: #171512; --ink: #EDE9E0; --muted: #9A9388; --line: #2C2823;
  --block: #3A362F; --slab: #1B1916; --ok: #4CC79A; --bad: #F0745A; --wait: #E9B04C; --tint: #1E1B17;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
} }
:root[data-theme="dark"] {
  --ground: #0E0D0B; --surface: #171512; --ink: #EDE9E0; --muted: #9A9388; --line: #2C2823;
  --block: #3A362F; --slab: #1B1916; --ok: #4CC79A; --bad: #F0745A; --wait: #E9B04C; --tint: #1E1B17;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--ink); font: 14px/1.45 var(--sans); overflow: hidden; }
code, .path, .mono { font-family: var(--mono); font-size: 12.5px; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
canvas.drag { cursor: grabbing; }
button { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, .row:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

header { position: fixed; top: 0; left: 0; right: 0; z-index: 4; display: flex; align-items: center; gap: 18px; padding: 0 20px; height: 52px; background: var(--surface); border-bottom: 1px solid var(--line); }
.mark { display: inline-flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
.repo { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav.tabs { display: flex; gap: 2px; align-self: stretch; margin-left: 6px; }
nav.tabs button { border: 0; border-radius: 0; background: none; padding: 0 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
nav.tabs .n { font: 600 11px var(--mono); background: var(--wait); color: var(--surface); border-radius: 9px; padding: 1px 6px; margin-left: 6px; }
.counts { display: flex; gap: 18px; margin-left: auto; font-size: 13px; white-space: nowrap; }
.counts b { font-weight: 650; font-variant-numeric: tabular-nums; margin-right: 5px; color: var(--ink); }
.counts span { color: var(--muted); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }
.live.off { background: var(--bad); }

.panel { position: fixed; top: 68px; width: 300px; max-height: calc(100vh - 130px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
#agents { left: 20px; }
#side { right: 20px; width: 340px; }
.panel h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; padding: 12px 14px 6px; }
.row { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; padding: 10px 14px; }
.row:first-of-type { border-top: 0; }
.row:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.row[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
.name { font-weight: 600; }
.who { color: var(--ink); font-weight: 500; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tags { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.tag { border: 1px solid var(--line); border-radius: 20px; padding: 0 8px; color: var(--muted); }
.tag.warn { color: var(--wait); border-color: var(--wait); }
.item { border-top: 1px solid var(--line); padding: 10px 14px; }
.item:first-of-type { border-top: 0; }
.st { font-weight: 650; }
.st.landed { color: var(--ok); } .st.blocked { color: var(--bad); } .st.needs-human { color: var(--wait); } .st.high { color: var(--bad); } .st.low { color: var(--muted); }
.when { float: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.empty { padding: 14px; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; padding: 4px 14px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
ul.plain { list-style: none; margin: 0; padding: 0 14px 12px; font-size: 13px; }
ul.plain li { padding: 3px 0; overflow-wrap: anywhere; }
.close { float: right; border: 0; background: none; padding: 8px 12px; color: var(--muted); }

footer { position: fixed; left: 20px; bottom: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.legend { position: fixed; right: 20px; bottom: 18px; color: var(--muted); font-size: 12.5px; display: flex; gap: 16px; align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -2px; border-radius: 2px; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); padding: 4px 8px; border-radius: 5px; font-size: 12.5px; display: none; white-space: nowrap; z-index: 5; }
dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; width: min(440px, 92vw); padding: 18px; }
dialog::backdrop { background: rgba(10,20,24,.45); }
dialog input { width: 100%; font: inherit; padding: 7px 9px; margin: 6px 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
dialog .acts { display: flex; gap: 8px; justify-content: flex-end; }

/* Views other than the map */
.page { position: fixed; inset: 52px 0 0 0; overflow: auto; background: var(--ground); z-index: 3; }
.page[hidden] { display: none; }
.page .in { max-width: 1120px; margin: 0 auto; padding: 28px 24px 64px; }
.page h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 4px; }
.page .lede { color: var(--muted); max-width: 70ch; margin: 0 0 22px; font-size: 15px; }
.page h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 30px 0 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.card .k { color: var(--muted); font-size: 12.5px; }
.card .v { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.card .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.card .d { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
.box .empty { padding: 18px; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
.t th, .t td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t tr:last-child td { border-bottom: 0; }
.t th { font-weight: 500; color: var(--muted); font-size: 12px; background: var(--tint); white-space: nowrap; }
.t td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.t .sub { -webkit-line-clamp: 3; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.wait { background: var(--wait); }
.pill { display: inline-block; border: 1px solid var(--line); border-radius: 20px; padding: 0 8px; font-size: 12px; color: var(--muted); white-space: nowrap; margin: 0 4px 3px 0; }
.pill.warn { color: var(--wait); border-color: var(--wait); } .pill.bad { color: var(--bad); border-color: var(--bad); } .pill.ok { color: var(--ok); border-color: var(--ok); }
/* The gate strip: one landing's passage through the gate, stage by stage. */
.strip { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 22px; gap: 3px; vertical-align: middle; }
.strip i { height: 8px; border-radius: 2px; background: var(--line); }
.strip i.ok { background: var(--ok); } .strip i.bad { background: var(--bad); } .strip i.wait { background: var(--wait); }
.stripkey { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin: 8px 2px 0; }
.meter { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; margin-right: 7px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 96px; padding: 14px 16px 10px; }
.bars i { flex: 1; max-width: 22px; min-height: 2px; background: var(--ink); border-radius: 2px 2px 0 0; opacity: .85; }
.bars i.bad { background: var(--bad); } .bars i.wait { background: var(--wait); }
/* The rail: main and the environments after it. */
.rail { display: flex; align-items: stretch; gap: 0; padding: 18px 16px; overflow-x: auto; }
.stop { min-width: 180px; flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--ground); }
.stop b { display: block; font-size: 15px; }
.join { align-self: center; min-width: 54px; text-align: center; color: var(--muted); font-size: 12px; border-top: 2px solid var(--line); margin: 0 6px; padding-top: 4px; white-space: nowrap; }
.join.behind { border-top-color: var(--wait); color: var(--wait); }
body[data-view]:not([data-view="visibility"]) .panel, body[data-view]:not([data-view="visibility"]) footer, body[data-view]:not([data-view="visibility"]) .legend { display: none; }
@media (max-width: 860px) {
  body { overflow: auto; }
  canvas { position: relative; height: 62vh; inset: auto; }
  header { position: sticky; height: auto; flex-wrap: wrap; padding: 8px 16px; gap: 8px 14px; } .counts { display: none; } nav.tabs { order: 3; width: 100%; overflow-x: auto; margin: 0; } nav.tabs button { padding: 8px 10px; }
  .page { position: static; } canvas { margin-top: 0; }
  .panel { position: static; width: auto !important; max-height: none; margin: 12px 16px; }
  footer, .legend { position: static; margin: 12px 16px; }
}
</style>
</head>
<body>
<canvas id="c" aria-label="Live map of the codebase. Blocks are files; colour shows which branch is changing them."></canvas>
<header>
  <span class="mark"><svg viewBox="0 0 64 64" width="24" height="24" aria-hidden="true"><path d="M10 18 32 6v24z" fill="#19A974"/><path d="M54 18 32 6v24z" fill="#F2B441"/><path d="M10 27l22 12v20L10 47z" fill="currentColor"/><path d="M54 27 32 39v20l22-12z" fill="currentColor" opacity=".55"/></svg>Canopy</span>
  <span class="repo"><span class="live" id="live"></span><span id="repo">connecting</span></span>
  <nav class="tabs" aria-label="Views" id="tabs">
    <button data-tab="visibility">Visibility</button><button data-tab="security">Security</button><button data-tab="performance">Performance</button><button data-tab="quality">Quality</button><button data-tab="outcome">Outcome</button>
  </nav>
  <div class="counts" id="counts"></div>
</header>
<main class="page" id="page" hidden></main>
<section class="panel" id="agents" aria-label="Branches being worked on"></section>
<section class="panel" id="side" aria-label="Activity"></section>
<footer>
  <button id="flat" aria-pressed="false">Flat view</button>
  <button id="reset">Reset view</button>
  <button id="theme">Light / dark</button>
</footer>
<div class="legend">
  <span><i style="background:var(--block)"></i>file</span>
  <span><i id="lg-w"></i>being changed</span>
  <span><i id="lg-r" style="background:none;border:2px solid"></i>being read</span>
  <span><i style="background:none;border-top:2px solid var(--bad);border-radius:0;height:2px"></i>one change affects another</span>
</div>
<div id="tip"></div>
<dialog id="dlg"></dialog>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const HUES = ['#E4572E', '#2E86AB', '#E0A021', '#7A5CC9', '#1FA67A', '#D94F8C', '#4C6FE0', '#8C8B1F', '#C0603A', '#2A9D9D'];
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ago = (ts) => { const s = Math.max(0, Math.round((Date.now() - ts) / 1000)); return s < 60 ? s + 's' : s < 3600 ? Math.round(s / 60) + 'm' : Math.round(s / 3600) + 'h'; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let S = null;              // latest server state
let blocks = [], byPath = new Map(), districts = [];
let colourOf = new Map();  // branch -> colour
let focus = null;          // branch highlighted from the left panel
let selected = null;       // block shown in the detail drawer
let detail = null;
let pulses = [];           // transient read flashes: { path, colour, t }
const view = { yaw: -0.62, pitch: 0.93, zoom: 1, px: 0, py: 0, hf: 1, flat: false };
const WORLD = { w: 1000, h: 640 };
const cv = $('c'), g = cv.getContext('2d');

function colour(branch) {
  if (!colourOf.has(branch)) colourOf.set(branch, HUES[colourOf.size % HUES.length]);
  return colourOf.get(branch);
}

// ---- layout: files -> treemap blocks ---------------------------------------
function squarify(items, x, y, w, h) {
  const total = items.reduce((a, i) => a + i.v, 0);
  if (!total || w <= 0 || h <= 0) return;
  const k = (w * h) / total;
  let i = 0;
  while (i < items.length) {
    const short = Math.min(w, h);
    let sum = 0, best = Infinity, mx = 0, mn = Infinity, j = i;
    while (j < items.length) {
      const a = items[j].v * k, s2 = sum + a;
      const nmx = Math.max(mx, a), nmn = Math.min(mn, a);
      const worst = Math.max((short * short * nmx) / (s2 * s2), (s2 * s2) / (short * short * nmn));
      if (worst > best) break;
      best = worst; sum = s2; mx = nmx; mn = nmn; j++;
    }
    const thick = sum / short;
    let off = 0;
    for (let n = i; n < j; n++) {
      const len = (items[n].v * k) / thick;
      items[n].r = w >= h ? { x, y: y + off, w: thick, h: len } : { x: x + off, y, w: len, h: thick };
      off += len;
    }
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    i = j;
  }
}
function buildMap(files) {
  const root = { name: '', kids: new Map(), v: 0, files: [] };
  for (const f of files) {
    const parts = f.p.split('/');
    let n = root;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!n.kids.has(parts[i])) n.kids.set(parts[i], { name: parts[i], path: parts.slice(0, i + 1).join('/'), kids: new Map(), v: 0, files: [] });
      n = n.kids.get(parts[i]);
    }
    n.files.push({ path: f.p, lines: f.l, v: Math.pow(Math.max(f.l, 12), 0.7), leaf: true });
  }
  const weigh = (n) => { n.v = n.files.reduce((a, f) => a + f.v, 0); n.lines = n.files.reduce((a, f) => a + f.lines, 0); for (const k of n.kids.values()) { weigh(k); n.v += k.v; n.lines += k.lines; } };
  weigh(root);
  blocks = []; byPath = new Map(); districts = [];
  const place = (n, r, depth) => {
    const pad = depth === 0 ? 0 : depth === 1 ? 7 : 2;
    const inner = { x: r.x + pad, y: r.y + pad, w: r.w - 2 * pad, h: r.h - 2 * pad };
    if (depth === 1) districts.push({ name: n.name, ...r });
    if (depth > 0 && Math.min(inner.w, inner.h) < 9) { addBlock(n.path + '/', r, n.lines, true); return; }
    const items = [...n.kids.values(), ...n.files].sort((a, b) => b.v - a.v);
    squarify(items, inner.x, inner.y, inner.w, inner.h);
    for (const it of items) { if (!it.r) continue; if (it.leaf) addBlock(it.path, it.r, it.lines, false); else place(it, it.r, depth + 1); }
  };
  const addBlock = (path, r, lines, group) => {
    const gap = Math.min(1.1, r.w * 0.12, r.h * 0.12);
    const b = { path, group, lines, x0: r.x + gap, y0: r.y + gap, x1: r.x + r.w - gap, y1: r.y + r.h - gap, h: 0 };
    blocks.push(b); byPath.set(path, b);
  };
  place(root, { x: 0, y: 0, w: WORLD.w, h: WORLD.h }, 0);
  // Height grows with file size, in proportion to how big blocks are on this map.
  side = Math.sqrt((WORLD.w * WORLD.h) / Math.max(1, blocks.length));
  maxH = 0;
  for (const b of blocks) { b.h = Math.min(90, side * (0.10 + 0.6 * Math.min(1, Math.log2(1 + b.lines / 20) / 7))); maxH = Math.max(maxH, b.h); }
  fitView();
}
function blockFor(path) {
  if (!path) return null;
  let b = byPath.get(path);
  for (let p = path; !b && p.includes('/');) { p = p.slice(0, p.lastIndexOf('/')); b = byPath.get(p + '/'); }
  return b || null;
}

// ---- drawing ---------------------------------------------------------------
let W = 0, H = 0, dpr = 1, dirty = true, hit = [], side = 20, maxH = 20;
const fit = { k: 1, cx: 0, cy: 0 };
// Scale and centre the map inside the space the panels leave free. Recomputed
// on resize and reset only, so the map holds still while it is being turned.
function fitView() {
  const wide = W > 1100;
  const ax0 = wide ? 336 : 14, ax1 = wide ? W - 376 : W - 14, ay0 = wide ? 70 : 84, ay1 = H - 64;
  const c = Math.cos(view.yaw), s = Math.sin(view.yaw), sp = Math.sin(view.pitch), cp = Math.cos(view.pitch);
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const [x, y] of [[0, 0], [WORLD.w, 0], [WORLD.w, WORLD.h], [0, WORLD.h]]) for (const z of [0, maxH * 1.15]) {
    const dx = x - WORLD.w / 2, dy = y - WORLD.h / 2, sx = dx * c - dy * s, sy = (dx * s + dy * c) * sp - z * view.hf * cp;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
  }
  fit.k = Math.max(0.05, Math.min((ax1 - ax0) / (x1 - x0), (ay1 - ay0 - 22) / (y1 - y0)));
  fit.cx = (ax0 + ax1) / 2 - ((x0 + x1) / 2) * fit.k; fit.cy = (ay0 + ay1 - 22) / 2 - ((y0 + y1) / 2) * fit.k;
  dirty = true;
}
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; fitView();
}
function base() { return fit.k; }
function proj(x, y, z) {
  const c = Math.cos(view.yaw), s = Math.sin(view.yaw);
  const dx = x - WORLD.w / 2, dy = y - WORLD.h / 2;
  const xr = dx * c - dy * s, yr = dx * s + dy * c;
  const sx = xr * fit.k + fit.cx, sy = (yr * Math.sin(view.pitch) - z * view.hf * Math.cos(view.pitch)) * fit.k + fit.cy;
  return [(sx - W / 2) * view.zoom + W / 2 + view.px, (sy - H / 2) * view.zoom + H / 2 + view.py, yr];
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const ch = (v) => Math.max(0, Math.min(255, Math.round(v * f)));
  return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`;
}
function poly(pts, fill, stroke, lw) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1; g.stroke(); }
}
function activity() {
  const writers = new Map(), readers = new Map();
  if (!S) return { writers, readers };
  for (const w of S.writes) {
    const b = blockFor(w.path); if (!b) continue;
    if (!writers.has(b)) writers.set(b, []);
    if (!writers.get(b).includes(w.branch)) writers.get(b).push(w.branch);
  }
  const bw = new Map(S.sessions.map((s) => [s.wt, s.branch]));
  for (const r of S.reads) {
    const b = blockFor(r.path); if (!b) continue;
    const br = bw.get(r.wt) || r.wt;
    if (!readers.has(b)) readers.set(b, new Map());
    readers.get(b).set(br, Math.max(readers.get(b).get(br) || 0, r.ts));
  }
  return { writers, readers };
}
function draw() {
  dirty = false;

function renderAgents() {
  const by = new Map();
  for (const s of S.sessions) {
    if (!by.has(s.branch)) by.set(s.branch, { branch: s.branch, wt: s.wt, task: '', active: false, taint: [], n: 0, seen: 0, who: new Set() });
    const a = by.get(s.branch);
    // Who the session acts for and which model it runs, as the harness reported them.
    if (s.user || s.model) a.who.add([s.user, s.model].filter(Boolean).join(' with '));
    a.task ||= s.task; a.active ||= s.active; a.seen = Math.max(a.seen, s.seen); a.n++;
    for (const t of s.taint) if (!a.taint.includes(t)) a.taint.push(t);
  }
  for (const w of S.writes) if (!by.has(w.branch)) by.set(w.branch, { branch: w.branch, wt: w.wt, task: '', active: false, taint: [], n: 0, seen: w.ts, who: new Set() });
  // Show a branch while a session is attached to it or it has unlanded changes.
  const inflight = new Set(S.writes.map((w) => w.branch));
  const rows = [...by.values()].filter((a) => a.active || inflight.has(a.branch)).sort((a, b) => b.seen - a.seen);
  const el = $('agents');
  if (!rows.length) { el.innerHTML = '<h2>Working now</h2><div class="empty">No agents are working. Start a Claude Code session in a worktree of this repository and it appears here.</div>'; return; }
  el.innerHTML = '<h2>Working now</h2>' + rows.map((a) => {
    const changing = new Set(S.writes.filter((w) => w.branch === a.branch).map((w) => w.path)).size;
    const notices = S.notices.filter((n) => n.open && n.target === a.wt).length;
    return `<button class="row" data-branch="${esc(a.branch)}" aria-pressed="${focus === a.branch}">
      <span class="sw" style="background:${colour(a.branch)}"></span><span class="name">${esc(a.branch)}</span><span class="when">${a.active ? 'active' : ago(a.seen) + ' ago'}</span>
      ${a.who.size ? `<div class="sub who">${esc([...a.who].slice(0, 3).join(', '))}</div>` : ''}
      <div class="sub">${esc(a.task || 'No task recorded yet')}</div>
      <div class="tags">${changing ? `<span class="tag">changing ${changing} file${changing > 1 ? 's' : ''}</span>` : ''}${notices ? `<span class="tag warn">${notices} open notice${notices > 1 ? 's' : ''}</span>` : ''}${a.taint.length ? `<span class="tag warn" title="${esc(a.taint.join(', '))}">read outside content</span>` : ''}</div>
    </button>`;
  }).join('');

}

        ${card('Sessions that read outside content', tainted.length, 'Web pages, MCP servers and network commands are remembered per worktree.')}
        ${card('Signed landings', signed, STATS ? `Key <code>${esc(STATS.key_id)}</code>` : '')}
        ${card('Notifications', CH && CH.channels.length && CH.routes.length ? CH.channels.map((c) => esc(c.name)).join(', ') : 'Off', CH && CH.channels.length && CH.routes.length ? `${CH.sent} sent${CH.failed ? `, ${CH.failed} failed` : ''}. Approvals and alerts go to ${esc([...new Set(CH.channels.map((c) => c.kind))].join(' and '))}.` : 'Send approvals and alerts to Slack or Discord: <code>canopy notify add &lt;name&gt; &lt;webhook&gt;</code>, then route them under <code>notify</code> in the rules.')}
      </div>
      <h2>Waiting for a person</h2>
      ${table(['Change', 'Asked for by', 'Why it is held', 'Waiting on', ''], PENDING.map((p) => [`<b>${esc(p.branch)}</b><div class="sub">${esc(p.intent || '')}</div>`, esc(p.by || ''), (p.reasons || []).slice(0, 3).map((r) => `<div class="sub">${esc(r)}</div>`).join(''),
        (p.waiting_on || []).map((q) => `<span class="pill warn">${q.token ? 'anyone holding the approval token' : esc(q.kind === 'person' ? 'a person' : q.section || 'the whole repository') + ': ' + esc(q.owners.join(', ') || 'no one eligible')}</span>`).join('') || '<span class="pill warn">a person</span>', approveBtn(p.id)]), 'Nothing is waiting. Changes that touch protected or owned code, or that took in outside content, stop here until someone approves the exact commit.')}
      <h2>Who is working, and with what</h2>
      ${table(['Branch', 'Person', 'Harness', 'Model', 'Outside content'], S.sessions.filter((s) => s.active).map((s) => [`<span class="sw" style="background:${colour(s.branch)}"></span>${esc(s.branch)}`, esc(s.user || 'not signed in'), esc(s.agent || ''), s.model ? `<code>${esc(s.model)}</code>` : '<span class="pill warn">unknown</span>', s.taint.map((t) => `<span class="pill warn">${esc(t)}</span>`).join('') || 'none']), 'No sessions are active.')}
      <h2>Policy on ${esc(S.main)}</h2>
      ${table(['Section', 'What applies'], S.rules.map((r) => [`<code>${esc(r.path || '(whole repository)')}</code>`, esc(r.text || 'no extra rules')]), 'No rules file yet. <code>canopy init</code> writes a starter.')}
      <h2>Audit log</h2>
      ${AUDIT ? table(['When', 'Person', 'From', 'Action', 'Target'], AUDIT.map((a) => [`${ago(a.ts)} ago`, esc(a.user || ''), `<code>${esc(a.ip || '')}</code>`, `<code>${esc(a.action)}</code>`, esc(a.target)]), 'Nothing recorded yet.') : '<div class="box"><div class="empty">The audit log names people and addresses, so only administrators can read it: <code>canopy audit</code>.</div></div>'}`;
  },
  performance() {
    const ran = S.landings.filter((l) => (l.checks || []).length).slice(0, 30).reverse();
    const max = Math.max(1, ...ran.map(checkMs)), times = ran.map(checkMs).sort((a, b) => a - b), med = times.length ? times[Math.floor(times.length / 2)] : 0;
    const slow = new Map();
    for (const l of ran) for (const c of l.checks) { const x = slow.get(c.cmd) || { n: 0, sum: 0, max: 0 }; x.n++; x.sum += c.ms; x.max = Math.max(x.max, c.ms); slow.set(c.cmd, x); }
    return `<h1>Performance</h1><p class="lede">What Canopy costs each agent on every tool call, and what each landing costs in checks.</p>
      <div class="cards">
        ${card('Hook round trip, median', STATS ? STATS.hook_ms_p50.toFixed(2) + '<small>ms</small>' : '', STATS ? `95th percentile ${STATS.hook_ms_p95.toFixed(2)} ms over ${STATS.hooks} hooks` : '')}
        ${card('Index', STATS ? ms(STATS.index_ms) : '', STATS ? `${STATS.files} files, ${STATS.nodes} symbols and files` : '')}
        ${card('Checks per landing, median', times.length ? ms(med) : 'none yet', 'Run in a sandbox on the exact merge commit.')}
        ${card('Check runs', STATS ? STATS.check_runs : '', `${S.landings.length} verdicts given`)}
      </div>
      <h2>Check time of the last ${ran.length} landings</h2>
      <div class="box">${ran.length ? `<div class="bars" role="img" aria-label="Check time per landing, oldest first. Longest ${ms(max)}.">${ran.map((l) => `<i class="${l.status === 'blocked' ? 'bad' : l.status === 'needs-human' ? 'wait' : ''}" style="height:${Math.max(3, Math.round(checkMs(l) / max * 100))}%" title="${esc(l.branch)}: ${ms(checkMs(l))}"></i>`).join('')}</div>` : '<div class="empty">No checks have run yet.</div>'}</div>
      <h2>Checks</h2>
      ${table(['Command', 'Runs', 'Average', 'Slowest'], [...slow].sort((a, b) => b[1].sum - a[1].sum).map(([cmd, x]) => [`<code>${esc(cmd)}</code>`, x.n, ms(x.sum / x.n), ms(x.max)]), 'Put your test command under <code>checks</code> in <code>.canopy/rules.json</code>.')}`;
  },
  quality() {
    const L = S.landings, n = (st) => L.filter((l) => l.status === st).length;
    const cov = L.filter((l) => typeof l.coverage === 'number'), avg = cov.length ? Math.round(cov.reduce((a, l) => a + l.coverage, 0) / cov.length * 100) : null;
    const opinions = L.filter((l) => l.manager);
    return `<h1>Quality</h1><p class="lede">Every change passes the same gate. Each bar below is one landing's passage through it: recorded, checked, given a second opinion, approved by people, signed.</p>
      <div class="cards">
        ${card('Landed', n('landed'))}${card('Needed a person', n('needs-human'))}${card('Refused', n('blocked'), 'Failed checks, stale assumptions, conflicts, or access.')}
        ${card('Read before landing, average', avg === null ? 'n/a' : avg + '<small>%</small>', 'Share of the affected code the agent had read.')}
        ${card('Second opinions', opinions.length, opinions.length ? `${opinions.filter((l) => l.manager !== 'pass').length} raised something` : 'No manager is configured.')}
      </div>
      <h2>Recent verdicts</h2>
      ${table(['Change', 'Verdict', 'Through the gate', 'Read', 'Why'], L.slice(0, 25).map((l) => [`<span class="sw" style="background:${colour(l.branch)}"></span><b>${esc(l.branch)}</b><div class="sub">${esc(l.intent || '')}</div>`, status(l), strip(l),
        `<span class="meter"><i style="width:${Math.round((l.coverage ?? 1) * 100)}%"></i></span>${Math.round((l.coverage ?? 1) * 100)}%${l.unread ? `<div class="sub">${l.unread} affected, not read</div>` : ''}`, (l.reasons || []).slice(0, 2).map((r) => `<div class="sub">${esc(r)}</div>`).join('')]), 'No verdicts yet. They appear when an agent runs <code>canopy land</code>.')}
      <div class="stripkey">${STAGES.map((x) => `<span>${x}</span>`).join('<span aria-hidden="true">›</span>')}<span><span class="dot ok"></span>passed</span><span><span class="dot wait"></span>waiting or flagged</span><span><span class="dot bad"></span>refused</span></div>`;
  },
  outcome() {
    const landed = S.landings.filter((l) => l.status === 'landed');
    const by = new Map();
    for (const l of S.landings) for (const m of new Set((l.authors || []).map((a) => a.model || 'unknown model'))) { const x = by.get(m) || { landed: 0, person: 0, blocked: 0 }; x[l.status === 'landed' ? 'landed' : l.status === 'blocked' ? 'blocked' : 'person']++; by.set(m, x); }
    const stops = [{ name: S.main, branch: S.main, at: S.rev, note: 'Moves only through signed landings.' }, ...ENVS.map((e) => ({ ...e, note: (e.approvals ? `Needs ${e.approvals} of ${e.approvers.join(', ')}. ` : '') + (e.promoters ? `Promoted by ${e.promoters.join(', ')}.` : 'Anyone may promote.') }))];
    return `<h1>Outcome</h1><p class="lede">What has actually reached ${esc(S.main)}, where it has gone from there, and how each model's work fared at the gate.</p>
      <h2>From ${esc(S.main)} onward</h2>
      <div class="box"><div class="rail">${stops.map((e, i) => `${i ? `<span class="join ${e.behind ? 'behind' : ''}">${e.at ? (e.behind ? `${e.behind} behind` : 'level') : 'not yet'}</span>` : ''}<div class="stop"><b>${esc(e.name)}</b><div class="sub">${e.at ? sha(e.at) : 'not created yet'}</div><div class="sub" style="-webkit-line-clamp:3">${esc(e.note)}</div>${i ? `<div class="sub"><code>canopy promote ${esc(e.name)}</code></div>` : ''}</div>`).join('')}</div>
      ${ENVS.length ? '' : `<div class="empty" style="border-top:1px solid var(--line)">No environments are defined. Add <code>environments</code> to the rules to guard staging and production the same way as ${esc(S.main)}.</div>`}</div>
      <h2>By model</h2>
      ${table(['Model, as the harness reported it', 'Landed', 'Needed a person', 'Refused'], [...by].sort((a, b) => b[1].landed - a[1].landed).map(([m, x]) => [`<code>${esc(m)}</code>`, x.landed, x.person, x.blocked]), 'No landings with a recorded author yet.')}
      <h2>What landed</h2>
      ${table(['When', 'Change', 'By', 'Written with', 'Commit'], landed.slice(0, 25).map((l) => [`${ago(l.ts)} ago`, `<b>${esc(l.branch)}</b><div class="sub">${esc(l.intent || '')}</div>`, (who(l) || '<span class="sub">not signed in</span>') + ((l.approvals || []).length ? `<div class="sub">approved by ${esc(l.approvals.map((a) => a.user).join(', '))}</div>` : ''), models(l), sha(l.commit)]), 'Nothing has landed through Canopy yet.')}`;
  },
};
function renderTabs() {
  for (const b of $('tabs').children) {
    const t = b.dataset.tab;
    if (t === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    if (t === 'security') b.innerHTML = 'Security' + (PENDING.length ? `<span class="n" aria-label="${PENDING.length} waiting">${PENDING.length}</span>` : '');
  }
}
function renderPage() {
  const page = $('page');
  document.body.dataset.view = tab;
  page.hidden = tab === 'visibility';
  if (page.hidden || !S) return;
  const y = page.scrollTop;
  page.innerHTML = `<div class="in">${VIEW[tab]()}</div>`;
  page.scrollTop = y;
  for (const b of page.querySelectorAll('[data-approve]')) b.onclick = () => approve(b.dataset.approve);
}
function go(t) {
  tab = TABS.includes(t) ? t : 'visibility';
  if (location.hash.slice(1) !== tab) history.replaceState(null, '', '#' + tab);
  renderTabs(); renderPage();
  if (tab === 'security') load();
  if (tab === 'visibility') { resize(); dirty = true; }
}
for (const b of $('tabs').children) b.onclick = () => go(b.dataset.tab);
addEventListener('hashchange', () => go(location.hash.slice(1)));
go(location.hash.slice(1));

let rev = null, timer = null;
async function load() {
  try {
    const st = await (await fetch('/api/state' + (rev ? '?rev=' + rev : ''))).json();
    if (st.files) { buildMap(st.files); rev = st.rev; }
    S = st; renderTop(); renderAgents(); renderSide(); dirty = true; $('live').classList.remove('off');
    const j = (u) => fetch(u).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    [STATS, ENVS, PENDING, WHO, CH] = await Promise.all([j('/api/stats'), j('/api/environments'), j('/api/pending'), j('/api/whoami'), j('/api/channels')]);
    ENVS ||= []; PENDING ||= [];
    if (tab === 'security') AUDIT = await j('/api/audit?limit=25');
    renderTabs(); renderPage();
  } catch { $('live').classList.add('off'); }
}
function connect() {
  const es = new EventSource('/api/events');
  es.onmessage = (m) => {
    let ev; try { ev = JSON.parse(m.data); } catch { return; }
    if (ev.type === 'read' && S && !reduced) { const s = S.sessions.find((x) => x.id === ev.session); pulses.push({ path: ev.path, colour: colour(s ? s.branch : ev.wt), t: Date.now() }); dirty = true; }
    clearTimeout(timer); timer = setTimeout(load, 120);
  };
  es.onerror = () => $('live').classList.add('off');
  es.onopen = () => { $('live').classList.remove('off'); load(); };
}
addEventListener('resize', resize);
resize(); tick(); load(); connect(); setInterval(() => { if (S) { renderSide(); dirty = true; } }, 15000);
</script>
